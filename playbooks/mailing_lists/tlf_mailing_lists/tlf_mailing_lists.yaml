---
# Look up the TLF project UID
tlf_mailing_list_project_lookup:
  type: nats-request
  params:
    subject: lfx.projects-api.slug_to_uid
  steps:
    - raw: tlf

# Create the primary GroupsIO service for TLF
tlf_groupsio_service:
  type: http-request
  params:
    url: {{ environ.MAILING_LIST_URL | default("http://lfx-v2-mailing-list-service.lfx.svc.cluster.local:8080") }}/groupsio/services?v=1
    method: POST
    headers:
      Authorization: !jwt bearer=true,aud=lfx-v2-mailing-list-service,principal=clients@m2m_helper
  steps:
    - json:
        project_uid: !ref "tlf_mailing_list_project_lookup.steps[0]._response"
        project_name: The Linux Foundation
        type: primary
        domain: {{ fake.domain_name() }}
        global_owners:
          {% for _ in range(fake.pyint(min_value=1, max_value=3)) %}
          - {{ fake.ascii_company_email() }}
          {% endfor %}
        writers:
          - name: project_super_admin
            email: project_super_admin@example.com
            username: project_super_admin

# Mailing list types and access configurations
{% set list_types = ['announcement', 'discussion_open', 'discussion_moderated'] %}
{% set access_types = ['public', 'approval_required', 'invite_only'] %}
{% set num_mailing_lists = fake.pyint(min_value=3, max_value=8) %}

# Pre-generate member counts for each mailing list so we can use them
# both for member creation and subscriber_count updates
{% set member_counts = [] %}
{% for i in range(num_mailing_lists) %}
  {% if member_counts.append(fake.pyint(min_value=5, max_value=12)) %}{% endif %}
{% endfor %}

# Create mailing lists for TLF
tlf_mailing_lists:
  type: http-request
  params:
    url: {{ environ.MAILING_LIST_URL | default("http://lfx-v2-mailing-list-service.lfx.svc.cluster.local:8080") }}/groupsio/mailing-lists?v=1
    method: POST
    headers:
      Authorization: !jwt bearer=true,aud=lfx-v2-mailing-list-service,principal=clients@m2m_helper
  steps:
    {% for i in range(num_mailing_lists) %}
    {% set list_name = fake.slug() %}
    {% set list_type = fake.random_element(list_types) %}
    {% set access_type = fake.random_element(access_types) %}
    {% set is_public = fake.pybool() %}
    {% set has_committee = fake.pybool() and access_type == 'invite_only' %}
    - json:
        group_name: {{ list_name | lower }}
        title: {{ fake.catch_phrase() }}
        description: >-
          {{ fake.paragraph(nb_sentences=3) }}
        public: {{ is_public | lower }}
        type: {{ list_type }}
        audience_access: {{ access_type }}
        subject_tag: "[{{ list_name | upper | replace('-', '') }}]"
        service_uid: !ref "tlf_groupsio_service.steps[0]._response.uid"
        {% if has_committee %}
        committees:
          - uid: !ref "tlf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
            allowed_voting_statuses:
              - Voting Rep
              - Alternate Voting Rep
        {% endif %}
        writers:
          - name: project_super_admin
            email: project_super_admin@example.com
            username: project_super_admin
    {% endfor %}

# Add members to each mailing list
{% for list_idx in range(num_mailing_lists) %}
tlf_mailing_list_{{ list_idx }}_members:
  type: http-request
  params:
    url: !sub "{{ environ.MAILING_LIST_URL | default('http://lfx-v2-mailing-list-service.lfx.svc.cluster.local:8080') }}/groupsio/mailing-lists/${ tlf_mailing_lists.steps[{{ list_idx }}]._response.uid }/members?v=1"
    method: POST
    headers:
      Authorization: !jwt bearer=true,aud=lfx-v2-mailing-list-service,principal=clients@m2m_helper
  steps:
    {% for i in range(member_counts[list_idx]) %}
    - json:
        email: {{ fake.ascii_company_email() }}
        first_name: {{ fake.first_name() }}
        last_name: {{ fake.last_name() }}
        username: {{ fake.user_name() }}
        organization: {{ fake.company() }}
        job_title: {{ fake.job() }}
        member_type: direct
        delivery_mode: {{ ['normal', 'digest', 'none'] | random }}
        {% if i == 0 %}
        mod_status: owner
        {% elif i == 1 %}
        mod_status: moderator
        {% else %}
        mod_status: none
        {% endif %}
    {% endfor %}
{% endfor %}
