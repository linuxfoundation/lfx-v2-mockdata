---
# Look up the TLF project UID
tlf_mailing_list_project_lookup:
  type: nats-request
  params:
    subject: lfx.projects-api.slug_to_uid
  steps:
    - raw: tlf

# Create the primary GroupsIO service for TLF
tlf_groupsio_service:
  type: http-request
  params:
    url: {{ environ.MAILING_LIST_URL | default("http://lfx-v2-mailing-list-service.lfx.svc.cluster.local:8080") }}/groupsio/services?v=1
    method: POST
    headers:
      Authorization: !jwt bearer=true,aud=lfx-v2-mailing-list-service,principal=clients@m2m_helper
  steps:
    - json:
        project_uid: !ref "tlf_mailing_list_project_lookup.steps[0]._response"
        project_name: The Linux Foundation
        type: primary
        domain: linuxfoundation.example.com
        global_owners:
          - project_super_admin@example.com
        writers:
          - project_super_admin

# Create mailing lists for TLF
tlf_mailing_lists:
  type: http-request
  params:
    url: {{ environ.MAILING_LIST_URL | default("http://lfx-v2-mailing-list-service.lfx.svc.cluster.local:8080") }}/groupsio/mailing-lists?v=1
    method: POST
    headers:
      Authorization: !jwt bearer=true,aud=lfx-v2-mailing-list-service,principal=clients@m2m_helper
  steps:
    # Board announcements mailing list - tied to Governing Board committee
    - json:
        group_name: board-announce
        title: Board Announcements
        description: >-
          Official announcements from The Linux Foundation Board of Directors.
          This is a read-only list for board communications and updates.
        public: false
        type: announcement
        audience_access: invite_only
        subject_tag: "[TLF-Board]"
        service_uid: !ref "tlf_groupsio_service.steps[0]._response.uid"
        writers:
          - project_super_admin
        committees:
          - uid: !ref "tlf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
            allowed_voting_statuses:
              - Voting Rep
              - Alternate Voting Rep
    # Board discussion mailing list - tied to Governing Board committee
    - json:
        group_name: board-discuss
        title: Board Discussion
        description: >-
          Discussion forum for The Linux Foundation Board of Directors.
          Moderated discussions on governance and strategic matters.
        public: false
        type: discussion_moderated
        audience_access: invite_only
        subject_tag: "[TLF-Board-Discuss]"
        service_uid: !ref "tlf_groupsio_service.steps[0]._response.uid"
        writers:
          - project_super_admin
        committees:
          - uid: !ref "tlf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
            allowed_voting_statuses:
              - Voting Rep
              - Alternate Voting Rep
              - Observer
    # General community mailing list
    - json:
        group_name: community
        title: TLF Community
        description: >-
          General community mailing list for The Linux Foundation members and
          contributors. Open discussions about LF projects and initiatives.
        public: false
        type: discussion_open
        audience_access: public
        subject_tag: "[TLF-Community]"
        service_uid: !ref "tlf_groupsio_service.steps[0]._response.uid"
        writers:
          - project_super_admin
    # Technical steering committee mailing list
    - json:
        group_name: tsc-discuss
        title: Technical Steering Committee
        description: >-
          Technical Steering Committee discussions for The Linux Foundation.
          Forum for technical governance and cross-project coordination.
        public: false
        type: discussion_moderated
        audience_access: approval_required
        subject_tag: "[TLF-TSC]"
        service_uid: !ref "tlf_groupsio_service.steps[0]._response.uid"
        writers:
          - project_super_admin
