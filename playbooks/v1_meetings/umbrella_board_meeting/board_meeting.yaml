# SPDX-License-Identifier: MIT
#
# This scheduled meeting, its past meetings, registrants, attendees, and
# artifacts all re-use a lot of variables and data, therefore it didn't make as
# much sense to to split the playbooks across multiple files.
---
buf_board_meeting_project_lookup:
  type: nats-request
  params:
    subject: lfx.projects-api.slug_to_uid
  steps:
    - raw: buf

{# This *must* match the range size used for the BUF board committee member
list. #}
{% set board_member_count = 8 -%}

#
# The scheduled meeting series itself.
#

{# Total past meetings is used to define the initial meeting time, AND in the
   loop that creates the past meetings. The logic is hardcoded to assume a
   once-per-month meeting. #}
{% set total_past_meetings = 3 -%}
{% set zoom_host_user = fake.pystr(min_chars=22, max_chars=22) %}

buf_board_meeting_create:
  type: nats-publish
  params:
    # Create the meeting in OpenSearch (via indexer).
    subject: lfx.index.v1_meeting
  steps:
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          {% set meeting_id = fake.pyint(min_value=10000000000, max_value=99999999999) %}
          {# Calculate initial (historical) meeting time based on `total_past_meetings`. #}
          {% set previous_meeting = fake.date_time_between(
            start_date='-28d',
            end_date='-14d',
          ) %}
          {% set meeting_start_time = (
            previous_meeting - timedelta(days=30 * (total_past_meetings - 1))
          ).replace(minute=0, second=0, microsecond=0) %}
          {% set meeting_duration = 60 %}
          {# Our logic only supports recurrence patterns of weeks 1 through 4,
             not "last week of the month", aka week "-1", so ensure we don't
             start on a month-day later than 28. #}
          {% if meeting_start_time.day > 28 %}
          {% set meeting_start_time = meeting_start_time.replace(day=28) %}
          {% endif %}
          {# Ensure it's on a weekday. #}
          {% if meeting_start_time.weekday() in (5, 6) %}
          {% set meeting_start_time = meeting_start_time - timedelta(days=2) %}
          {% endif %}
          {# Map Python weekday (0 = Monday, 6 = Sunday) to Zoom (1 = Sunday, 7 = Saturday). #}
          {% set zoom_week_day = (meeting_start_time.weekday() + 1) % 7 + 1 %}
          {% set week_of_month = (meeting_start_time.day / 7) | round(0, 'ceil') | int %}
          {% set recurrence_end_date_time = meeting_start_time + timedelta(days=365*100) %}
          # Renamed from `meeting_id` in v1.
          id: "{{ meeting_id }}"
          topic: Monthly Board Meeting
          visibility: private
          agenda: "Monthly meeting for the Big Umbrella Foundation board. {{ fake.sentence() }}"
          # This is rewritten as an array to incorporate the "mappings" one-to-many table.
          committees:
            - uid: !ref "buf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
              filters: []
          restricted: true
          password: {{ fake.uuid4() }}
          recurrence:
            # 100 years from initial meeting.
            end_date_time: "{{ recurrence_end_date_time.isoformat() }}Z"
            repeat_interval: "1"
            type: "3"
            monthly_week: "{{ week_of_month }}"
            monthly_week_day: "{{ zoom_week_day }}"
          series_end_date: "{{ (recurrence_end_date_time + timedelta(minutes=meeting_duration)).isoformat() }}Z"
          zoom_ai_enabled: true
          # 6-digit numeric passcode.
          host_key: "{{ fake.pyint(min_value=100000, max_value=999999) }}"
          transcript_enabled: true
          early_join_time: "60"
          recording_enabled: true
          duration: "{{ meeting_duration }}"
          recording_access: public
          concurrent_zoom_user_enabled: true
          # TODO.
          #updated_occurrences:
          #   - duration: "60"
          #     recurrence:
          #       repeat_interval: "2"
          #       end_date_time: "2124-10-07T13:00:00Z"
          #       type: "2"
          #       weekly_days: "3"
          #     old_occurrence_id: "1762275600"
          #     timezone: ""
          #     topic: Monthly Board Meeting
          #     all_following: true
          #     new_occurrence_id: "1762275600"
          #     agenda: ""
          require_ai_summary_approval: true
          use_new_invite_email_address: true
          # TODO
          #ics_additional_uids:
          #  - 98457927869:2025-11-04T17:00:00Z
          created_at: &board_meeting_created_at
            "{{ fake.date_time_between(start_date='-1y', end_date='-90d').isoformat() }}Z"
          meeting_type: Board
          join_url: "https://zoom.example/j/{{ meeting_id }}?pwd={{ fake.pystr() }}"
          transcript_access: public
          # Use the NEXT (future) meeting time for the scheduled meeting
          start_time: "{{ meeting_start_time.isoformat() }}Z"
          # Note, proj_id (sfid) in the source data will have been stripped by lfx-v1-sync-helper.
          project_uid: !ref "buf_board_meeting_project_lookup.steps[0]._response"
          # Note, this is later than `created_at`.
          modified_at: "{{ fake.date_time_between(start_date='-90d', end_date='-30d').isoformat() }}Z"
          last_end_time: "{{ (meeting_start_time + timedelta(days=365*100, minutes=meeting_duration+60)).timestamp() | int }}"
          user_id: "{{ zoom_host_user }}"
          last_mailing_list_members_sync_job_status: none
          # Use "America/Los_Angeles" 50% of the time, else random.
          {% if fake.pybool() %}
          timezone: "America/Los_Angeles"
          {% else %}
          timezone: "{{ fake.timezone() }}"
          {% endif %}
          last_bulk_registrant_job_status: none
          ai_summary_access: public
          # 6-digit numeric passcode.
          passcode: "{{ fake.pyint(min_value=100000, max_value=999999) }}"
          meeting_id: "{{ meeting_id }}"
          show_meeting_attendees: true
        tags:
          # Plain UID (for broad text search)
          - "{{ meeting_id }}"
          # Prefixed meeting_uid
          - "meeting_uid:{{ meeting_id }}"
          # Project UID
          - !sub "project_uid:${buf_board_meeting_project_lookup.steps[0]._response}"
          # Committee UID
          - !sub "committee_uid:${buf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]}"
          # Meeting type
          - "meeting_type:Board"

buf_board_meeting_access_update:
  type: nats-publish
  params:
    # Add meeting relationships in OpenFGA (via fga-sync).
    subject: lfx.update_access.v1_meeting
  steps:
    - json: !ref buf_board_meeting_create.steps[0].json.data

#
# Participants for the scheduled meeting itself.
#
# Note, there is no "v1_meeting_settings" object, since in v2 that only holds
# organizers, which don't exist in v1.
#

{% set member_has_username = fake.pylist(nb_elements=board_member_count, variable_nb_elements=False, value_types=["bool"]) %}

buf_board_meeting_committee_participants_create:
  type: nats-publish
  params:
    # Create the registered participant in OpenSearch (via indexer).
    subject: lfx.index.v1_meeting_registrant
  steps:
    # Count matches the count in buf_board_members.
    {% for i in range(board_member_count) %}
    {% set registrant_id = fake.uuid4() %}
    {% set registrant_username = fake.user_name() if member_has_username[i] else "" %}
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          # Renamed from `registrant_id` in v1.
          id: "{{ registrant_id }}"
          meeting_id: "{{ meeting_id }}"
          committee: !ref "buf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
          org: !ref "buf_board_members.steps[{{ i }}].json.organization.name"
          org_is_project_member: {{ fake.pybool() }}
          email: !ref "buf_board_members.steps[{{ i }}].json.email"
          last_invite_delivery_successful: true
          last_invite_received_time: "{{ fake.date_time_between(start_date='-30d', end_date='now').isoformat() }}Z"
          # TODO.
          profile_picture: "https://lfx-cdn-prod.s3.amazonaws.com/users/avatar/a.png"
          host: {{ fake.pybool() }}
          last_invite_bounced: false
          {% if fake.pybool() %}
          job_title: "-"
          {% else %}
          job_title: "{{ fake.job() }}"
          {% endif %}
          {% if fake.pybool() %}
          created_at: *board_meeting_created_at
          {% else %}
          created_at: "{{ fake.date_time_between(start_date='-90d', end_date='-60d').isoformat() }}Z"
          {% endif %}
          org_is_member: {{ fake.pybool() }}
          last_invite_received_message_id: "{{ fake.uuid4().replace('-', '')[0:40] }}"
          modified_at: "{{ fake.date_time_between(start_date='-60d', end_date='-30d').isoformat() }}Z"
          # 50% chance to be empty, else use the local part of their email as a
          # mock LFID username. `user_id` (sfid) is stripped by lfx-v1-sync-helper.
          username: "{{ registrant_username }}"
          last_name: !ref "buf_board_members.steps[{{ i }}].json.last_name"
          # faker emails SHOULD be all lowercase at present.
          case_sensitive_email: !ref buf_board_members.steps[{{ i }}].json.email
          first_name: !ref buf_board_members.steps[{{ i }}].json.first_name
          last_invite_delivered_time: "{{ fake.date_time_between(start_date='-60d', end_date='now').isoformat() }}Z"
          type: committee
        tags:
          # Plain UID
          - "{{ registrant_id }}"
          # Prefixed registrant_uid
          - "registrant_uid:{{ registrant_id }}"
          # Meeting UID
          - "meeting_uid:{{ meeting_id }}"
          # Email
          - !sub "email:${buf_board_members.steps[{{ i }}].json.email}"
          {% if registrant_username %}
          # Username (only if set)
          - "username:{{ registrant_username }}"
          {% endif %}
    {% endfor %}

buf_board_meeting_committee_participants_access_update:
  type: nats-publish
  params:
    # Create the registered participant in OpenFGA (via fga-sync).
    subject: lfx.put_registrant.v1_meeting
  steps:
    {% for i in range(board_member_count) %}
    {% if member_has_username[i] %}
    {# Only send access update if the member has a username! #}
    - json: !ref buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data
    {% endif %}
    {% endfor %}

#
# Loop over each past meeting.
#

{% set ns = namespace(occurrence_start_time=meeting_start_time) %}
{# Loop over the number of past monthly meetings to create #}
{% for past_meeting_index in range(total_past_meetings) -%}
{# Note, incrementing occurrence_start_time happpens at the END of the loop. #}
{% set occurrence_actual_start = fake.date_time_between(
  start_date=ns.occurrence_start_time - timedelta(minutes=10),
  end_date=ns.occurrence_start_time + timedelta(minutes=2),
) %}
{% set occurrence_actual_end = fake.date_time_between(
  start_date=occurrence_actual_start + timedelta(minutes=meeting_duration-15),
  end_date=ns.occurrence_start_time + timedelta(minutes=meeting_duration+15),
) %}
{% set occurrence_created = fake.date_time_between(
  start_date=occurrence_actual_start,
  end_date=occurrence_actual_start + timedelta(seconds=15),
) %}
{% set occurrence_modified = fake.date_time_between(
  start_date=occurrence_created,
  end_date=occurrence_actual_end,
) %}
{% set occurrence_id = (ns.occurrence_start_time.timestamp() * 1000) | int -%}
{% set session_uuid = b64encode(fake.binary(length=16)) %}

buf_board_past_meeting_{{ past_meeting_index }}_create:
  type: nats-publish
  params:
    # Create the past meeting in OpenSearch (via indexer).
    subject: lfx.index.v1_past_meeting
  steps:
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          # Renamed from `meeting_and_occurrence_id` in v1.
          id: "{{ meeting_id }}-{{ occurrence_id }}"
          topic: Monthly Board Meeting
          artifacts: null
          visibility: public
          agenda: "Monthly meeting for the Big Umbrella Foundation board. {{ fake.sentence() }}"
          committees:
            - uid: !ref "buf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
              filters:
                - voting_rep
                - alt_voting_rep
                - observer
                - emeritus
          restricted: true
          is_manually_created: false
          project_slug: buf
          scheduled_end_time: "{{ (ns.occurrence_start_time + timedelta(minutes=meeting_duration)).isoformat() }}Z"
          recurrence: !ref buf_board_meeting_create.steps[0].json.data.recurrence
          zoom_ai_enabled: true
          transcript_enabled: true
          early_join_time: "10"
          sessions:
            - end_time: "{{ occurrence_actual_end.isoformat() }}Z"
              uuid: "{{ session_uuid }}"
              start_time: "{{ occurrence_actual_start.isoformat() }}Z"
          recording_enabled: true
          duration: "{{ meeting_duration }}"
          meeting_id: "{{ meeting_id }}"
          recording_access: public
          scheduled_start_time: "{{ ns.occurrence_start_time.isoformat() }}Z"
          require_ai_summary_approval: true
          created_at: "{{ occurrence_created.isoformat() }}Z"
          meeting_type: ""
          occurrence_id: "{{ occurrence_id }}"
          transcript_access: public
          recording_password: ""
          # Note, proj_id (sfid) in the source data will have been stripped by
          # lfx-v1-sync-helper. We'll still keep project_slug, though.
          project_uid: !ref "buf_board_meeting_project_lookup.steps[0]._response"
          modified_at: "{{ occurrence_modified.isoformat() }}Z"
          timezone: !ref buf_board_meeting_create.steps[0].json.data.timezone
          ai_summary_access: public
          # TODO ... what is this? (it didn't necesesarily match recurrence.type in my test data)
          type: "3"
        tags:
          # Plain UID (past_meeting_uid)
          - "{{ meeting_id }}-{{ occurrence_id }}"
          # Prefixed past_meeting_uid
          - "past_meeting_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Meeting UID
          - "meeting_uid:{{ meeting_id }}"
          # Project UID
          - !sub "project_uid:${buf_board_meeting_project_lookup.steps[0]._response}"
          # Occurrence ID
          - "occurrence_id:{{ occurrence_id }}"
          # Committee UID
          - !sub "committee_uid:${buf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]}"

buf_board_past_meeting_{{ past_meeting_index }}_access_update:
  type: nats-publish
  params:
    # Add past meeting relationships in OpenFGA (via fga-sync).
    subject: lfx.update_access.v1_past_meeting
  steps:
    - json: !ref buf_board_past_meeting_{{ past_meeting_index }}_create.steps[0].json.data

#
# Meeting artifacts (recording, transcript, summary) for each past meeting.
#

{% set recording_create_time = fake.date_time_between(
  start_date=occurrence_actual_end,
  end_date=occurrence_actual_end + timedelta(minutes=30),
) %}
{% set recording_modify_time = fake.date_time_between(
  start_date=recording_create_time,
  end_date=recording_create_time + timedelta(minutes=5),
) %}
{% set audio_only_size = fake.pyint(min_value=60000000, max_value=120000000) %}
{% set timeline_size = fake.pyint(min_value=2000000, max_value=5000000) %}
{% set shared_screen_with_speaker_view_size = fake.pyint(min_value=100000000, max_value=800000000) %}
{% set chat_file_size = fake.pyint(min_value=10, max_value=200) %}
{% set audio_transcript_size = fake.pyint(min_value=80000, max_value=200000) %}
{% set total_recording_size = (
  audio_only_size +
  timeline_size +
  shared_screen_with_speaker_view_size +
  chat_file_size +
  audio_transcript_size
) %}
{# The "share" object's size doesn't include the transcript, based on observed
   data. #}
{% set total_size_without_transcript = (
  audio_only_size +
  timeline_size +
  shared_screen_with_speaker_view_size +
  chat_file_size
) -%}

buf_board_past_meeting_{{ past_meeting_index }}_recording_create:
  type: nats-publish
  params:
    # Create the past meeting recording in OpenSearch (via indexer).
    subject: lfx.index.v1_past_meeting_recording
  steps:
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          # Renamed from `meeting_and_occurrence_id` in v1.
          id: "{{ meeting_id }}-{{ occurrence_id }}"
          # This is a filtered version of the v1 recordings object.
          created_at: "{{ recording_create_time.isoformat() }}Z"
          total_size: "{{ total_recording_size }}"
          topic: Monthly Board Meeting
          occurrence_id: "{{ occurrence_id }}"
          # `visibility` is for the meeting and should not be used for this object.
          # visibility: public
          recording_files:
            {% set recording_hash = fake.pystr(min_chars=90, max_chars=120) %}
            - play_url: https://zoom.example/rec/play/{{ recording_hash }}
              file_type: M4A
              meeting_id: "{{ session_uuid }}"
              recording_type: audio_only
              download_url: https://zoom.example/rec/webhook_download/{{ recording_hash }}/{{ fake.pystr(min_chars=340, max_chars=350) }}
              file_extension: M4A
              id: {{ fake.uuid4() }}
              file_size: "{{ audio_only_size }}"
              status: completed
              recording_start: "{{ occurrence_actual_start.isoformat() }}Z"
              recording_end: "{{ occurrence_actual_end.isoformat() }}Z"
            {% set recording_hash = fake.pystr(min_chars=90, max_chars=120) %}
            - play_url: https://zoom.example/rec/play/{{ recording_hash }}
              file_type: MP4
              meeting_id: "{{ session_uuid }}"
              recording_type: shared_screen_with_speaker_view
              download_url: https://zoom.example/rec/webhook_download/{{ recording_hash }}/{{ fake.pystr(min_chars=340, max_chars=350) }}
              file_extension: MP4
              id: {{ fake.uuid4() }}
              file_size: "{{ shared_screen_with_speaker_view_size }}"
              status: completed
              recording_start: "{{ occurrence_actual_start.isoformat() }}Z"
              recording_end: "{{ occurrence_actual_end.isoformat() }}Z"
            {% set recording_hash = fake.pystr(min_chars=90, max_chars=120) %}
            - play_url: https://zoom.example/rec/play/{{ recording_hash }}
              meeting_id: "{{ session_uuid }}"
              recording_type: chat_file
              file_type: CHAT
              download_url: https://zoom.example/rec/webhook_download/{{ recording_hash }}/{{ fake.pystr(min_chars=340, max_chars=350) }}
              file_extension: TXT
              id: {{ fake.uuid4() }}
              file_size: "{{ chat_file_size }}"
              recording_start: "{{ occurrence_actual_start.isoformat() }}Z"
              status: completed
              recording_end: "{{ occurrence_actual_end.isoformat() }}Z"
          # `transcript_access` is filtered from the recording object.
          # transcript_access: public
          start_time: ""
          host_id: {{ zoom_host_user }}
          # Note, proj_id (sfid) in the source data will have been stripped by lfx-v1-sync-helper.
          project_uid: !ref "buf_board_meeting_project_lookup.steps[0]._response"
          modified_at: "{{ recording_modify_time.isoformat() }}Z"
          project_slug: buf
          transcript_enabled: true
          host_email: itx+example999@lfx.linuxfoundation.org
          sessions:
            {% set share_hash = fake.pystr(min_chars=80, max_chars=90) %}
            - total_size: "{{ total_size_without_transcript }}"
              start_time: "{{ occurrence_actual_start.isoformat() }}Z"
              password: ""
              uuid: "{{ session_uuid }}"
              share_url: https://zoom.example/rec/share/{{ share_hash }}
          recording_count: "5"
          meeting_id: "{{ meeting_id }}"
          recording_access: public
        tags:
          # Plain UID (past_meeting_recording_uid)
          - "{{ meeting_id }}-{{ occurrence_id }}"
          # Prefixed past_meeting_recording_uid
          - "past_meeting_recording_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Past meeting UID
          - "past_meeting_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Platform
          - "platform:Zoom"
          # Platform meeting ID
          - "platform_meeting_id:{{ meeting_id }}"
          # Platform meeting instance ID (session UUID)
          - "platform_meeting_instance_id:{{ session_uuid }}"

buf_board_past_meeting_{{ past_meeting_index }}_recording_access_update:
  type: nats-publish
  params:
    # Add past meeting recording relationships in OpenFGA (via fga-sync).
    subject: lfx.update_access.v1_past_meeting_recording
  steps:
    - json:
        # Only include the fields needed for access control
        id: !ref buf_board_past_meeting_{{ past_meeting_index }}_recording_create.steps[0].json.data.id
        meeting_and_occurrence_id: !ref buf_board_past_meeting_{{ past_meeting_index }}_recording_create.steps[0].json.data.id
        recording_access: public
        participants:
          {% for i in range(board_member_count) %}
          {% if member_has_username[i] %}
          - lf_sso: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.username"
            host: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.host"
            is_invited: true
            is_attended: !ref "buf_board_past_meeting_{{ past_meeting_index }}_participants_create.steps[{{ i }}].json.data.is_attended"
          {% endif %}
          {% endfor %}

buf_board_past_meeting_{{ past_meeting_index }}_transcript_create:
  type: nats-publish
  params:
    # Create the past meeting transcript in OpenSearch (via indexer).
    subject: lfx.index.v1_past_meeting_transcript
  steps:
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          # Renamed from `meeting_and_occurrence_id` in v1.
          id: "{{ meeting_id }}-{{ occurrence_id }}"
          # This is a filtered version of the v1 recordings object.
          created_at: "{{ recording_create_time.isoformat() }}Z"
          total_size: "{{ total_recording_size }}"
          topic: Monthly Board Meeting
          occurrence_id: "{{ occurrence_id }}"
          # `visibility` is for the meeting and should not be used for this object.
          # visibility: public
          recording_files:
            {% set recording_hash = fake.pystr(min_chars=90, max_chars=120) %}
            - play_url: ""
              file_type: TIMELINE
              meeting_id: "{{ session_uuid }}"
              recording_type: timeline
              download_url: https://zoom.example/rec/webhook_download/{{ recording_hash }}/{{ fake.pystr(min_chars=340, max_chars=350) }}
              file_extension: JSON
              id: {{ fake.uuid4() }}
              file_size: "{{ timeline_size }}"
              recording_end: "{{ occurrence_actual_end.isoformat() }}Z"
              recording_start: "{{ occurrence_actual_start.isoformat() }}Z"
              status: completed
            {% set recording_hash = fake.pystr(min_chars=90, max_chars=120) %}
            - play_url: https://zoom.example/rec/play/{{ recording_hash }}
              meeting_id: "{{ session_uuid }}"
              file_type: TRANSCRIPT
              recording_type: audio_transcript
              download_url: https://zoom.example/rec/webhook_download/{{ recording_hash }}/{{ fake.pystr(min_chars=340, max_chars=350) }}
              file_extension: VTT
              id: {{ fake.uuid4() }}
              file_size: "{{ audio_transcript_size }}"
              recording_start: "{{ occurrence_actual_start.isoformat() }}Z"
              status: completed
              recording_end: "{{ occurrence_actual_end.isoformat() }}Z"
          transcript_access: public
          start_time: ""
          host_id: {{ zoom_host_user }}
          # Note, proj_id (sfid) in the source data will have been stripped by lfx-v1-sync-helper.
          project_uid: !ref "buf_board_meeting_project_lookup.steps[0]._response"
          modified_at: "{{ recording_modify_time.isoformat() }}Z"
          project_slug: buf
          transcript_enabled: true
          host_email: itx+example999@lfx.linuxfoundation.org
          sessions:
            {% set share_hash = fake.pystr(min_chars=80, max_chars=90) %}
            - total_size: "{{ total_size_without_transcript }}"
              start_time: "{{ occurrence_actual_start.isoformat() }}Z"
              password: ""
              uuid: "{{ session_uuid }}"
              share_url: https://zoom.example/rec/share/{{ share_hash }}
          recording_count: "5"
          meeting_id: "{{ meeting_id }}"
          # `recording_access` is filtered from the transcript object.
          # recording_access: public
        tags:
          # Plain UID (past_meeting_transcript_uid)
          - "{{ meeting_id }}-{{ occurrence_id }}"
          # Prefixed past_meeting_transcript_uid
          - "past_meeting_transcript_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Past meeting UID
          - "past_meeting_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Platform
          - "platform:Zoom"
          # Platform meeting ID
          - "platform_meeting_id:{{ meeting_id }}"
          # Platform meeting instance ID (session UUID)
          - "platform_meeting_instance_id:{{ session_uuid }}"

buf_board_past_meeting_{{ past_meeting_index }}_transcript_access_update:
  type: nats-publish
  params:
    # Add past meeting transcript relationships in OpenFGA (via fga-sync).
    subject: lfx.update_access.v1_past_meeting_transcript
  steps:
    - json:
        # Only include the fields needed for access control
        id: !ref buf_board_past_meeting_{{ past_meeting_index }}_transcript_create.steps[0].json.data.id
        meeting_and_occurrence_id: !ref buf_board_past_meeting_{{ past_meeting_index }}_transcript_create.steps[0].json.data.id
        transcript_access: public
        participants:
          {% for i in range(board_member_count) %}
          {% if member_has_username[i] %}
          - lf_sso: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.username"
            host: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.host"
            is_invited: true
            is_attended: !ref "buf_board_past_meeting_{{ past_meeting_index }}_participants_create.steps[{{ i }}].json.data.is_attended"
          {% endif %}
          {% endfor %}

{% set summary_create_time = fake.date_time_between(
  start_date=occurrence_actual_end,
  end_date=occurrence_actual_end + timedelta(minutes=10),
) %}
{% set summary_id = fake.uuid4() %}

buf_board_past_meeting_{{ past_meeting_index }}_summary_create:
  type: nats-publish
  params:
    # Create the registered participant in OpenSearch (via indexer).
    subject: lfx.index.v1_past_meeting_summary
  steps:
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          summary_details:
            {% for i in range(fake.pyint(min_value=8, max_value=12)) %}
            - summary: >-
                {% for i in range(fake.pyint(min_value=3, max_value=6)) -%}
                {{ fake.sentence() }}
                {% endfor %}
              label: {{ fake.catch_phrase() }}
            {% endfor %}
          requires_approval: true
          zoom_meeting_uuid: {{ session_uuid }}
          edited_next_steps: null
          approved: {{ fake.pybool() }}
          summary_created_time: "{{ summary_create_time.isoformat() }}Z"
          password: {{ fake.uuid4() }}
          summary_last_modified_time: "{{ summary_create_time.isoformat() }}Z"
          summary_start_time: "{{ occurrence_actual_start.isoformat() }}Z"
          summary_title: Meeting Summary for Monthly Board Meeting
          zoom_meeting_topic: Monthly Board Meeting
          meeting_and_occurrence_id: "{{ meeting_id }}-{{ occurrence_id }}"
          id: "{{ summary_id }}"
          meeting_id: "{{ meeting_id }}"
          edited_summary_details: null
          email_sent: true
          created_at: "{{ summary_create_time.isoformat() }}Z"
          edited_summary_overview: ""
          next_steps:
            {% for i in range(fake.pyint(min_value=8, max_value=11)) %}
            - "{{ fake.first_name() }}: {{ fake.bs() }} and {{ fake.bs() }}"
            {% endfor %}
          occurrence_id: "{{ occurrence_id }}"
          summary_end_time: "{{ occurrence_actual_end.isoformat() }}Z"
          modified_at: "{{ summary_create_time.isoformat() }}Z"
          zoom_meeting_host_email: itx+example999@lfx.linuxfoundation.org
          # TODO.
          zoom_webhook_event: '{"event":"event.name","event_ts":9999,"payload":{"key":"value"}}'
          zoom_meeting_host_id: "{{ zoom_host_user }}"
          summary_overview: >-
            The Board meeting {{ fake.sentence(nb_words=6).lower() -}}
            {% for i in range(fake.pyint(min_value=2, max_value=5)) -%}
            {{ fake.sentence() -}}
            {% endfor %}
        tags:
          # Plain UID (past_meeting_summary_uid)
          - "{{ summary_id }}"
          # Prefixed past_meeting_summary_uid
          - "past_meeting_summary_uid:{{ summary_id }}"
          # Past meeting UID
          - "past_meeting_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Meeting UID
          - "meeting_uid:{{ meeting_id }}"
          # Platform
          - "platform:Zoom"

buf_board_past_meetings_{{ past_meeting_index }}_summary_access_update:
  type: nats-publish
  params:
    # The past meeting AI summary (to fga-sync).
    subject: lfx.update_access.v1_past_meeting_summary
  steps:
    - json:
        # Only include the fields needed for access control
        id: !ref buf_board_past_meeting_{{ past_meeting_index }}_summary_create.steps[0].json.data.id
        meeting_and_occurrence_id: !ref buf_board_past_meeting_{{ past_meeting_index }}_summary_create.steps[0].json.data.meeting_and_occurrence_id
        summary_access: public
        participants:
          {% for i in range(board_member_count) %}
          {% if member_has_username[i] %}
          - lf_sso: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.username"
            host: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.host"
            is_invited: true
            is_attended: !ref "buf_board_past_meeting_{{ past_meeting_index }}_participants_create.steps[{{ i }}].json.data.is_attended"
          {% endif %}
          {% endfor %}

#
# Add participants for past meeting occurrence #{{ past_meeting_index }}.
#

buf_board_past_meeting_{{ past_meeting_index }}_participants_create:
  type: nats-publish
  params:
    # Create the registered participant in OpenSearch (via indexer).
    subject: lfx.index.v1_past_meeting_participant
  steps:
    {% for i in range(board_member_count) -%}
    {# 50-50 chance of this participant also being an attender #}
    {% set is_attended = fake.pybool() %}
    {% set participant_id = fake.uuid4() %}
    {% if is_attended %}
    {% set attendee_join_time = fake.date_time_between(
      start_date=occurrence_actual_start,
      end_date=occurrence_actual_start + timedelta(minutes=meeting_duration//2),
    ) %}
    {% set attendee_leave_time = fake.date_time_between(
      start_date=occurrence_actual_end - timedelta(minutes=meeting_duration//2),
      end_date=occurrence_actual_end,
    ) %}
    {% endif %}
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          # v2 attributes for convenience.
          is_invited: true
          is_attended: {{ is_attended }}
          # The remaining attributes are a combination of synced ITX "attendees"
          # and "invitees" table data.
          org: !ref "buf_board_members.steps[{{ i }}].json.organization.name"
          committee_role: !ref "buf_board_members.steps[{{ i }}].json.role.name"
          org_is_project_member: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.org_is_project_member"
          registrant_id: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.id"
          invitee_id: {{ fake.uuid4() }}
          email: !ref "buf_board_members.steps[{{ i }}].json.email"
          first_name: !ref "buf_board_members.steps[{{ i }}].json.first_name"
          last_name: !ref "buf_board_members.steps[{{ i }}].json.last_name"
          job_title: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.job_title"
          project_slug: buf
          profile_picture: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.profile_picture"
          committee_voting_status: !ref "buf_board_members.steps[{{ i }}].json.voting.status"
          meeting_id: "{{ meeting_id }}"
          meeting_and_occurrence_id: "{{ meeting_id }}-{{ occurrence_id }}"
          created_at: "{{ occurrence_created.isoformat() }}Z"
          occurrence_id: "{{ occurrence_id }}"
          org_is_member: false
          # Note, proj_id (sfid) in the source data will have been stripped by lfx-v1-sync-helper.
          project_uid: !ref "buf_board_meeting_project_lookup.steps[0]._response"
          {% if is_attended %}
          modified_at: "{{ (attendee_leave_time + timedelta(seconds=3)).isoformat() }}Z"
          {% else %}
          modified_at: "{{ occurrence_modified.isoformat() }}Z"
          {% endif %}
          # Note, lf_user_id (sfid) is stripped by lfx-v1-sync-helper.
          lf_sso: !ref "buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.username"
          committee_id: !ref "buf_committees.steps[?json.name == 'Governing Board']._response.uid | [0]"
          {% if is_attended %}
          # name is captured for attendees only (first/last are captured for invitees).
          name: !sub "${ buf_board_members.steps[{{ i }}].json.first_name } ${ buf_board_members.steps[{{ i }}].json.last_name }"
          # more attendee-specific fields:
          sessions:
            - leave_time: "{{ attendee_leave_time.isoformat() }}Z"
              leave_reason: 'left the meeting. Reason : left the meeting'
              join_time: "{{ attendee_join_time.isoformat() }}Z"
              participant_uuid: "{{ fake.uuid4().upper() }}"
          id: "{{ participant_id }}"
          # This seems wrong in the observed source data (it's false even though
          # committee_voting_status is set!). Keeping as-is for fidelity.
          is_committee_member: false
          is_verified: true
          is_unknown: false
          AverageAttendance: "0"
          {% endif %}
        tags:
          # Plain UID (past_meeting_participant_uid)
          - "{{ participant_id }}"
          # Prefixed past_meeting_participant_uid
          - "past_meeting_participant_uid:{{ participant_id }}"
          # Past meeting UID
          - "past_meeting_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Meeting UID
          - "meeting_uid:{{ meeting_id }}"
          # Email
          - !sub "email:${buf_board_members.steps[{{ i }}].json.email}"
          {% if member_has_username[i] %}
          # Username (only if set)
          - !sub "username:${buf_board_meeting_committee_participants_create.steps[{{ i }}].json.data.username}"
          {% endif %}
    {% endfor %}

buf_board_past_meeting_{{ past_meeting_index }}_participants_access_update:
  type: nats-publish
  params:
    # Create the past-meeting participant in OpenFGA (via fga-sync).
    subject: lfx.put_participant.v1_past_meeting
  steps:
    {% for i in range(board_member_count) %}
    {% if member_has_username[i] %}
    {# Only send access update if the member has a username! #}
    - json: !ref buf_board_past_meeting_{{ past_meeting_index }}_participants_create.steps[{{ i }}].json.data
    {% endif %}
    {% endfor %}

#
# Add 1 to 2 guests to this occurrence (indexer only; no fga-sync).
#

buf_board_past_meeting_{{ past_meeting_index }}_participant_guests_create:
  type: nats-publish
  params:
    subject: lfx.index.v1_past_meeting_participant
  steps:
    {% for i in range(fake.pyint(min_value=1, max_value=2)) -%}
    {% set guest_participant_id = fake.uuid4() %}
    {% set attendee_join_time = fake.date_time_between(
      start_date=occurrence_actual_start,
      end_date=occurrence_actual_start + timedelta(minutes=meeting_duration//2),
    ) %}
    {% set attendee_leave_time = fake.date_time_between(
      start_date=occurrence_actual_end - timedelta(minutes=meeting_duration//2),
      end_date=occurrence_actual_end,
    ) %}
    - json:
        action: created
        headers:
          authorization: !jwt bearer=true,aud=lfx-v2-project-service,principal={{ fake.user_name() }},email={{ fake.email() }}
          x-on-behalf-of: !jwt bearer=true,aud=lfx-v2-project-service,principal=clients@m2m_helper
        data:
          # v2 attributes for convenience.
          is_invited: false
          is_attended: true
          # The remaining attributes only come from the ITX "attendees" table, so
          # some things are missing (like first/last names).
          org: ""
          committee_role: ""
          org_is_project_member: false
          registrant_id: ""
          email: ""
          name: "{{ fake.name() }} ({{ fake.company() }})"
          project_slug: buf
          profile_picture: ""
          is_committee_member: false
          committee_voting_status: ""
          sessions:
            - leave_time: "{{ attendee_leave_time.isoformat() }}Z"
              leave_reason: 'left the meeting. Reason : left the meeting'
              join_time: "{{ attendee_join_time.isoformat() }}Z"
              participant_uuid: "{{ fake.uuid4().upper() }}"
          meeting_and_occurrence_id: "{{ meeting_id }}-{{ occurrence_id }}"
          id: "{{ guest_participant_id }}"
          meeting_id: "{{ meeting_id }}"
          is_verified: false
          job_title: ""
          is_unknown: false
          AverageAttendance: "0"
          created_at: "{{ (attendee_join_time + timedelta(seconds=3)).isoformat() }}Z"
          occurrence_id: "{{ occurrence_id }}"
          org_is_member: false
          # Note, proj_id (sfid) in the source data will have been stripped by lfx-v1-sync-helper.
          project_uid: !ref "buf_board_meeting_project_lookup.steps[0]._response"
          modified_at: "{{ (attendee_leave_time + timedelta(seconds=3)).isoformat() }}Z"
          # Note, lf_user_id (sfid) is stripped by lfx-v1-sync-helper.
          lf_sso: ""
          committee_id: ""
        tags:
          # Plain UID (past_meeting_participant_uid)
          - "{{ guest_participant_id }}"
          # Prefixed past_meeting_participant_uid
          - "past_meeting_participant_uid:{{ guest_participant_id }}"
          # Past meeting UID
          - "past_meeting_uid:{{ meeting_id }}-{{ occurrence_id }}"
          # Meeting UID
          - "meeting_uid:{{ meeting_id }}"
          # Guest participants don't have first_name, last_name, email, or username
    {% endfor %}

{# Find the next past meeting time based on the same day-of-week and
   week-of-month as the previous meeting. #}
{% set weeks_to_next_month = ((32 - ns.occurrence_start_time.day) / 7) | round(0, 'ceil') | int %}
{% set ns.occurrence_start_time = ns.occurrence_start_time + timedelta(days=7 * weeks_to_next_month) %}
{# Now, adjust to the correct week in the month. #}
{% set week_offset = ((ns.occurrence_start_time.day / 7) | round(0, 'ceil') | int) - week_of_month %}
{% set ns.occurrence_start_time = ns.occurrence_start_time - timedelta(days=7 * week_offset) %}

{%- endfor %}
